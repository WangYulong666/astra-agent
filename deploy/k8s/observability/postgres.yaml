# Langfuse 的业务库（org/project/user/api-key/prompt 等事务数据）
#
# 与 base/postgres.yaml 是**两个不同的库**：那是平台自己的租户/会话库，
# 这是 Langfuse 的库。名字刻意带前缀 langfuse-，避免在集群里出现两个都叫 postgres
# 的 StatefulSet（虽在不同 ns，但 kubectl 全局视图里极其容易点错）。
#
# 生产：换成 RDS / 独立 PG 集群，把 DATABASE_URL 写进 Secret。
# Langfuse v3 要求 PG ≥ 12；这里用 16。
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: astra-ops
  labels: { app: langfuse-postgres }
spec:
  clusterIP: None
  selector: { app: langfuse-postgres }
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: astra-ops
  labels: { app: langfuse-postgres }
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels: { app: langfuse-postgres }
  template:
    metadata:
      labels: { app: langfuse-postgres }
    spec:
      securityContext:
        # postgres 官方镜像里 postgres 用户是 uid/gid 70
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: langfuse }
            - { name: POSTGRES_DB, value: langfuse }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: langfuse-db, key: password } }
            # 数据落子目录：PVC 根目录直接给 PGDATA 时，lost+found 会让 initdb 拒绝初始化
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U langfuse -d langfuse -h 127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U langfuse -d langfuse -h 127.0.0.1"] }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
