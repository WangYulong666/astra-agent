# ⚠️ 示例 Secret —— 文件名带 .example 就是为了**不被 kustomize 应用**
#    （不在 kustomization.yaml 的 resources 里）。里面全是假值，照抄跑不起来。
#
# 真值怎么给（三选一，与本仓库 base/secret.example.yaml 的规矩一致）：
#   kubectl -n astra-data create secret generic vector-s3 \
#     --from-literal=access-key='<S3 access key>' \
#     --from-literal=secret-key='<S3 secret key>' \
#     --from-file=s3.json=./s3-rendered.json
#
# 三个键必须自洽：
#   · access-key / secret-key  → 注入 Milvus 的 MINIO_ACCESS_KEY_ID / MINIO_SECRET_KEY
#   · s3.json                  → 挂给 SeaweedFS 的 -s3.config，里面的 credentials 必须
#                                与上面两个键**逐字一致**，否则 SeaweedFS 拒绝 Milvus 的请求
#
# 为什么 s3.json 里必须有 identities：SeaweedFS 在 identities 为空时**默认放行匿名读写**。
# 放在集群里意味着集群内任何 pod 都能读写整个对象存储。
---
apiVersion: v1
kind: Secret
metadata:
  name: vector-s3
  namespace: astra-data
type: Opaque
stringData:
  access-key: "<S3_ACCESS_KEY>"
  secret-key: "<S3_SECRET_KEY>"
  s3.json: |
    {
      "identities": [
        {
          "name": "astra",
          "credentials": [
            { "accessKey": "<S3_ACCESS_KEY>", "secretKey": "<S3_SECRET_KEY>" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
