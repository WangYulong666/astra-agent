# ⚠️ 这只是**示例**，文件名带 .example 就是为了不被 kustomize 应用、
#    不被 ArgoCD 同步、不被 `kubectl apply -k` 带上（它不在 kustomization.yaml
#    的 resources 里）。里面的值全是假的，照抄会直接跑不起来。
#
# 为什么不把真值写进 git：
#   Secret 是 base64 不是加密，进 git 等于公开（任何有读权限的人都能解）。
# 生产怎么给真值（三选一，按现有基础设施挑）：
#   1. External Secrets Operator ← 已有 Vault / 云 KMS 时首选
#   2. SealedSecrets             ← 没有 Vault 但想「密文进 git」
#   3. kubectl create secret     ← 最土，但集群重建要人工补一遍
# 示例（真值只出现在命令行，不进仓库）：
#   kubectl -n astra-system create secret generic astra-db \
#     --from-literal=dsn='postgres://astra:<密码>@postgres.astra-system.svc:5432/astra?sslmode=require' \
#     --from-literal=postgres-password='<同一个密码>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 本文件同时是「清单引用了哪些 Secret 键」的唯一说明来源：
# check-deploy.sh 会拿 Deployment 里的 secretKeyRef 逐个核对这里的键是否存在，
# 少一个就在部署时报 CreateContainerConfigError（而不是启动后才报错）。
---
# 数据库连接串（含密码）。postgres-password 单独一份是给 postgres.yaml 里
# 开发用 StatefulSet 初始化时用的 —— 两处必须是同一个密码，否则 DSN 连不上。
apiVersion: v1
kind: Secret
metadata:
  name: astra-db
  namespace: astra-system
type: Opaque
stringData:
  dsn: "postgres://astra:REPLACE_ME_dev_only@postgres.astra-system.svc:5432/astra?sslmode=disable"
  postgres-password: "REPLACE_ME_dev_only"
---
# 用户 JWT 与沙箱租户令牌刻意分成两个键：轮转周期不同，
# 一个泄露也不至于两套凭据一起作废。
# 长度要求：HS256 至少 32 字节；更短的话 auth.New 会直接拒绝启动。
apiVersion: v1
kind: Secret
metadata:
  name: astra-auth
  namespace: astra-system
type: Opaque
stringData:
  jwt-secret: "REPLACE_ME_dev_only_32bytes_minimum_0000"
  sandbox-token-secret: "REPLACE_ME_dev_only_another_32bytes_000"
---
# LLM 上游真 key。
# 它只会被 astra-api 以 -llm-key 的形式读进内存（见 astra-api.yaml 的注释：
# 刻意不注入成 DEEPSEEK_API_KEY，否则会被 agent 子进程继承进沙箱）。
apiVersion: v1
kind: Secret
metadata:
  name: astra-llm
  namespace: astra-system
type: Opaque
stringData:
  api-key: "REPLACE_ME_dev_only_sk_not_a_real_key"
---
# CubeSandbox 控制面 API token
apiVersion: v1
kind: Secret
metadata:
  name: astra-cube
  namespace: astra-system
type: Opaque
stringData:
  api-token: "REPLACE_ME_dev_only_cube_token"
