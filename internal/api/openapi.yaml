        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: remote_list_sessions
      summary: "列出本租户会话。"
      tags: [Remote]
      responses:
        "200":
          description: "会话列表。"
        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/remote/sessions/{id}:
    get:
      operationId: remote_get_session
      summary: "取单个会话状态。"
      tags: [Remote]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "设备或会话 id。"
      responses:
        "200":
          description: "会话记录。"
        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: remote_end_session
      summary: "结束会话（任一方急停）。"
      tags: [Remote]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "设备或会话 id。"
      responses:
        "204":
          description: "已结束。"
  /v1/remote/sessions/{id}/approve:
    post:
      operationId: remote_approve_session
      summary: "桌面端批准接管（pending_approval → active）。"
      tags: [Remote]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "设备或会话 id。"
      responses:
        "200":
          description: "会话记录。"
        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/remote/sessions/{id}/stream:
    get:
      operationId: remote_stream
      summary: "WebSocket：接收 JPEG 帧、发送输入事件。需 ?ticket= 一次性票据。"
      tags: [Remote]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "设备或会话 id。"
      responses:
        "101":
          description: "协议升级为 WebSocket。"
        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/remote/sessions/{id}/actions:
    post:
      operationId: remote_action
      summary: "执行快捷操作（打开应用/网址、截屏、锁屏）。"
      tags: [Remote]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "设备或会话 id。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "操作结果。"
        "503":
          description: "能力未启用。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/openapi.json:
    get:
      operationId: get_openapi
      summary: "契约导出（本文件解析后的 JSON）。"
      tags: [Meta]
      description: "路由注册为公开：/docs 页面在浏览器里直接拉它，不该被登录态挡住。"
      security: []
      responses:
        "200":
          description: "OpenAPI 文档。"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: "内嵌的 YAML 解析失败（构建期的错，不是请求的错）。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /docs:
    get:
      operationId: get_docs
      summary: "自包含的契约浏览页（不依赖外部 CDN）。"
      tags: [Meta]
      security: []
      responses:
        "200":
          description: "HTML 页面，数据来自 /v1/openapi.json。"
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录拿到的人用 JWT（HS256，默认 24h）。"
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "机器用长期凭据，形如 astra_sk_xxx；也可以放在 Authorization: Bearer 里。"

  parameters:
    SessionId:
      name: id
      in: path
      description: "会话 id（26 字符）。"
      required: true
      schema:
        type: string
    RunId:
      name: id
      in: path
      description: "run id（26 字符）。"
      required: true
      schema:
        type: string
    TenantId:
      name: id
      in: path
      description: "租户 id。"
      required: true
      schema:
        type: string
    FromTime:
      name: from
      in: query
      description: "起始时间，RFC3339 或 2006-01-02（按 UTC 当天 0 点解释）。"
      required: false
      schema:
        type: string
    ToTime:
      name: to
      in: query
      description: "结束时间，格式同 from。"
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: "返回条数上限；非法值退回默认值而不是报错。"
      required: false
      schema:
        type: integer

  schemas:
    Error:
      type: object
      description: "所有失败响应都是这个形状；fail() 只写 error 一个字段。"
      required: [error]
      properties:
        error:
          type: string
          description: "面向人的错误文案，不是机器码。"
          example: "会话不存在"

    Principal:
      type: object
      description: "一次请求的身份。所有 handler 的 tenantId 都从这里取。"
      properties:
        userId:
          type: string
        tenantId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        via:
          type: string
          description: "凭据来源：jwt / apikey / dev（单机兼容模式）。"
          enum: [jwt, apikey, dev]
        keyId:
          type: string
          description: "via=apikey 时有值。"

    Session:
      type: object
      description: "会话。1 会话 = 1 沙箱 = 1 个 agent 进程。"
      required: [id, sandboxId, agentSessionId, cwd, status]
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: "归属租户；单租户兼容模式下为空。"
        userId:
          type: string
        sandboxId:
          type: string
          description: "当前与 id 相同（不做复用池），单独留字段以便以后能换。"
        agentSessionId:
          type: string
          description: "ACP 的 sessionId，与平台会话 id 不是一回事。"
        title:
          type: string
        cwd:
          type: string
        status:
          type: string
          enum: [active, idle, deleted]
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time

    Run:
      type: object
      description: "一次 prompt 执行，也是事件流的归属单位。"
      required: [id, sessionId, status, input, nextSeq]
      properties:
        id:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum: [queued, running, waiting_approval, completed, failed, cancelled]
        input:
          type: string
        stopReason:
          type: string
        error:
          type: string
        nextSeq:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    Event:
      type: object
      description: "一条已落库的事件。seq 在 run 内单调连续，从 1 开始。"
      required: [seq, type]
      properties:
        seq:
          type: integer
          format: int64
        type:
          type: string
          description: "message_delta / thought_delta / tool_call_start / tool_call_update / approval_req / approval_result / agent_log / error / run_state"
          enum: [message_delta, thought_delta, tool_call_start, tool_call_update, approval_req, approval_result, agent_log, error, run_state]
        payload:
          description: "事件体，形状随 type 而定。"
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Approval:
      type: object
      description: "一条挂在人面前的审批请求。"
      required: [runId, toolCallId]
      properties:
        runId:
          type: string
        toolCallId:
          type: string
        title:
          type: string
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: "到点自动按拒绝处理，避免把 run 与沙箱锁一起吊死。"

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, deny]

    ApprovalResult:
      type: object
      description: "审批回执。事件流里的 approval_result 是另一条记录。"
      properties:
        runId:
          type: string
        toolCallId:
          type: string
        decision:
          type: string
          enum: [allow, deny, timeout]

    Meta:
      type: object
      description: "运行信息。键值都是字符串，字段随装配而变（provider / agent / policy / requireAuth / tenantId / email / role）。"
      additionalProperties:
        type: string

    Tenant:
      type: object
      required: [id, name, slug, status]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: "登录用短名，全局唯一，创建后不可改。"
        status:
          type: string
          enum: [active, suspended]
        monthlyTokenLimit:
          type: integer
          format: int64
          description: "每月 token 上限，0 表示不限。"
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      description: "用户。邮箱在租户内唯一，密码哈希永远不出 API。"
      required: [id, tenantId, email, role, status]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    APIKey:
      type: object
      description: "长期凭据。库里只有 sha256(明文)，所以只有 prefix 可展示。"
      required: [id, tenantId, userId, name, prefix]
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: "形如 astra_sk_a1b2c3，够用户认出是哪把钥匙。"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    Usage:
      type: object
      description: "一次模型调用的用量。source=gateway 才参与计费。"
      required: [id, tenantId, provider, model, inputTokens, outputTokens, costMicroUsd, source]
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        sessionId:
          type: string
        runId:
          type: string
        provider:
          type: string
          description: "deepseek / openai / ..."
        model:
          type: string
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costMicroUsd:
          type: integer
          format: int64
          description: "微美元（1e-6 USD）整数存储，避免浮点累加误差。"
        source:
          type: string
          enum: [gateway, agent]
        createdAt:
          type: string
          format: date-time

    UsageSum:
      type: object
      required: [inputTokens, outputTokens, costMicroUsd, calls]
      properties:
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costMicroUsd:
          type: integer
          format: int64
        calls:
          type: integer
          format: int64

    UsageReport:
      type: object
      description: "明细 + 汇总一起回：前端要同时画列表和顶部数字。"
      required: [items, sum]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usage'
        sum:
          $ref: '#/components/schemas/UsageSum'

    Billing:
      type: object
      description: "本月计费视图。金额从微美元换算成美元只在展示层做一次。"
      required: [inputTokens, outputTokens, costUsd, calls, monthlyTokenLimit, usedPercent, overLimit]
      properties:
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costUsd:
          type: number
          description: "美元，保留 4 位小数。"
        calls:
          type: integer
          format: int64
        monthlyTokenLimit:
          type: integer
          format: int64
          description: "0 表示不限。"
        usedPercent:
          type: number
          description: "已用百分比，保留 2 位小数；额度为 0 时是 0。"
        overLimit:
          type: boolean
          description: "用满即视为超限（>= 而非 >）。"

    AuditLog:
      type: object
      description: "只记「改变了状态或读了敏感数据」的动作，不记全量请求。"
      required: [id, tenantId, action, targetType]
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        actorEmail:
          type: string
        action:
          type: string
          example: "session.create"
        targetType:
          type: string
          description: "session / user / apikey / sandbox / tenant / run"
        targetId:
          type: string
        detail:
          description: "动作相关的结构化细节。"
          additionalProperties: true
        ip:
          type: string
        createdAt:
          type: string
          format: date-time

    Sandbox:
      type: object
      description: "沙箱条目。刻意不含 Endpoint：里面有能直接连进沙箱的凭据。"
      required: [id, provider, state]
      properties:
        id:
          type: string
        provider:
          type: string
        state:
          type: string
        workspace:
          type: string
        pid:
          type: integer
          description: "local provider 的 acp-proxy 进程号；其它 provider 为 0。"
        createdAt:
          type: string
          format: date-time
        sessionId:
          type: string
        sessionTitle:
          type: string
        tenantId:
          type: string
        userId:
          type: string

    FileEntry:
      type: object
      required: [name, path, isDir, size]
      properties:
        name:
          type: string
        path:
          type: string
          description: "相对工作区的 URL 风格路径，始终用正斜杠。"
        isDir:
          type: boolean
        size:
          type: integer
          format: int64
        modTime:
          type: string
          format: date-time

    FileListing:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'

    FileContent:
      type: object
      description: "文件预览。二进制或超限时 content 为空。"
      required: [path, size, truncated, binary]
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
          format: int64
        truncated:
          type: boolean
          description: "超过 512KB 时为真。"
        binary:
          type: boolean
          description: "前 8KB 里有 NUL 即判为二进制。"

    LoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant:
          type: string
          description: "租户 slug，大小写不敏感。"
        email:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, expiresAt, user, tenant]
      properties:
        token:
          type: string
          description: "JWT，放进 Authorization: Bearer。"
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: "30 天，typ=refresh，只能用于 /v1/auth/refresh。缺省表示当前认证实现不支持刷新。"
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time

    BootstrapRequest:
      type: object
      required: [tenantName, slug, email, password]
      properties:
        tenantName:
          type: string
        slug:
          type: string
          description: "小写字母、数字、连字符，3~32 位。"
        email:
          type: string
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          description: "至少 8 位。"

    SetupState:
      type: object
      description: "向导状态。llmGateway / llmConfigured 反映启动时是否开了网关、有没有可用 key。"
      required: [needsSetup, llmGateway, llmConfigured]
      properties:
        agentName:
          type: string
        approval:
          type: string
        needsSetup:
          type: boolean
          description: "系统里一个租户都没有时为 true。"
        llmGateway:
          type: boolean
        llmConfigured:
          type: boolean
          description: "网关开着且存了 key。"

    SetupCompleteRequest:
      type: object
      required: [email, password]
      properties:
        slug:
          type: string
          description: "租户短名；留空用 default。"
        name:
          type: string
          description: "租户显示名；留空用「默认租户」。"
        email:
          type: string
        password:
          type: string
          format: password
          description: "至少 8 位。"

    SetupCompleteResponse:
      type: object
      description: "tenant / user 一定有；token 只在 autoLogin=true 时出现。"
      required: [tenant, user, autoLogin]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        user:
          $ref: '#/components/schemas/User'
        autoLogin:
          type: boolean
          description: "false 表示账号已建好但签发 token 失败，需去登录页手输密码。"
        token:
          type: string
          description: "JWT，与 /v1/auth/login 返回的同形。"

    LLMSettingsView:
      type: object
      description: "上游凭据状态。只回有没有 key，永不回 key 本体。"
      required: [gateway]
      properties:
        gateway:
          type: boolean
          description: "启动时是否启用了 LLM 网关。"
        hasKey:
          type: boolean
        baseUrl:
          type: string

    UpdateLLMSettingsRequest:
      type: object
      properties:
        apiKey:
          type: string
          format: password
          description: "空串表示清除已存的 key。"
        baseUrl:
          type: string

    LLMSettingsTestRequest:
      type: object
      description: "两个字段都可选：不带 key 时测当前已配置的。"
      properties:
        apiKey:
          type: string
          format: password
        baseUrl:
          type: string
          description: "留空用 DeepSeek 官方地址。"

    LLMSettingsTestResult:
      type: object
      description: "无论连通与否都是 200，结果用 ok 表达。"
      required: [ok]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          description: "ok=true 时有值。"
        error:
          type: string
          description: "ok=false 时的失败原因，面向人。"

    LifecyclePolicyView:
      type: object
      description: "回收策略快照。时长同时给秒数（前端换算）与可读串（运维直读）。"
      required: [sweepIntervalSeconds, idleTimeoutSeconds, maxAgeSeconds, maxPerTenant, sweepInterval, idleTimeout, maxAge, enabled]
      properties:
        sweepIntervalSeconds:
          type: integer
          format: int64
        idleTimeoutSeconds:
          type: integer
          format: int64
        maxAgeSeconds:
          type: integer
          format: int64
        maxPerTenant:
          type: integer
        sweepInterval:
          type: string
          description: "0 显示 off 而不是 0s，避免被误读成「立刻超时」。"
        idleTimeout:
          type: string
        maxAge:
          type: string
        enabled:
          type: boolean
          description: "false 时后台循环不启动、手动清扫也不销毁任何东西。"

    LifecycleReportView:
      type: object
      description: "一轮清扫的结果；paused 为保留文件的本地暂停数，destroyed 为销毁数。"
      required: [scanned, destroyed, orphaned, expired, idle, kept, errors, startedAt, finishedAt]
      properties:
        scanned:
          type: integer
        paused:
          type: integer
        destroyed:
          type: integer
        orphaned:
          type: integer
        expired:
          type: integer
        idle:
          type: integer
        kept:
          type: integer
        errors:
          type: array
          items:
            type: string
          description: "没有错误时是空数组而不是 null。"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    LifecycleStatusView:
      type: object
      required: [policy]
      properties:
        policy:
          $ref: '#/components/schemas/LifecyclePolicyView'
        lastSweep:
          $ref: '#/components/schemas/LifecycleReportView'
          description: "进程起来后还没扫过时为 null；「扫了但什么都没找到」是全 0 报告，两者不是一回事。"

    CreateSessionRequest:
      type: object
      properties:
        cwd:
          type: string
          description: "留空用服务端默认目录（各沙箱自己的 workspace）。"

    UpdateSessionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: "超过 80 个字符会被截断；只有它可以改。"

    CreateRunRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string

    CreateTenantRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        monthlyTokenLimit:
          type: integer
          format: int64
          description: "0 表示不限。"

    UpdateTenantRequest:
      type: object
      description: "三个字段都是可选的；只传要改的那个。"
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
        monthlyTokenLimit:
          type: integer
          format: int64

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
          description: "缺省 member（最小权限）。只有 owner 能创建 owner。"
        password:
          type: string
          format: password
          description: "留空则由系统生成。"

    CreateUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        initialPassword:
          type: string
          description: "仅当密码由系统生成时出现，且只出现这一次。"

    UpdateUserRequest:
      type: object
      description: "四个字段都是可选的。"
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, suspended]
        password:
          type: string
          format: password
          description: "管理员重置密码；不回明文。"

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "用于在列表里区分是哪把钥匙。"
        userId:
          type: string
          description: "挂在谁名下；省略则挂在调用者自己名下，目标必须属于本租户。"
        expiresInDays:
          type: integer
          description: "0 表示不过期。"

    CreateAPIKeyResponse:
      type: object
      required: [key, plaintext]
      properties:
        key:
          $ref: '#/components/schemas/APIKey'
        plaintext:
          type: string
          description: "明文只在这一个响应里出现一次，之后任何接口都只能看到 prefix。"

    LLMToken:
      type: object
      description: "短期虚拟 key，绑定 tenant/user/session，默认 2h。"
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        baseUrl:
          type: string
          description: "沙箱应使用的网关地址。"

    MemoryItem:
      type: object
      description: "一条长期记忆。score 只在检索结果里有值。"
      required: [id, tenant_id, user_id, kind, text, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        kind:
          type: string
          enum: [fact, conversation]
        text:
          type: string
          description: "原文。入库时按 UTF-8 边界截断到 8192 字节。"
        score:
          type: number
          format: float
          description: "相似度，越大越相近（Milvus 的 L2 距离已换算成 1/(1+d)）。"
        created_at:
          type: string
          format: date-time
        meta:
          type: object
          additionalProperties: true

    MemoryIngestRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        kind:
          type: string
          enum: [fact, conversation]
          default: fact
        session_id:
          type: string
        meta:
          type: object
          additionalProperties: true

    MemorySearchResult:
      type: object
      required: [items, query, k]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryItem'
        query:
          type: string
        k:
          type: integer

    MemoryStats:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        backend:
          type: string
          description: "milvus / disabled。"
        collection:
          type: string
        count:
          type: integer
          format: int64
        dim:
          type: integer
        embedder:
          type: string

    ObsConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        endpoint:
          type: string
        dashboard_url:
          type: string
        public_key:
          type: string

    ObsTrace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        run_id:
          type: string
        status:
          type: string
        latency_ms:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        url:
          type: string
          description: "Langfuse 面板地址，点开看完整链路。"
        input:
          type: string

    ObsTraceList:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObsTrace'
        limit:
          type: integer
