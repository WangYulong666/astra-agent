# 上游依赖锁定表 —— 单一事实来源
#
# 规则：
#   1. 任何「从上游拉代码」的动作都必须读这张表，脚本里**不允许**硬编码 URL 或版本
#   2. 升级上游 = 只改这里的 commit，然后跑 scripts/sync-upstream.sh
#   3. 每个 commit 都必须是完整 40 位 sha，不接受 branch / tag（branch 会漂移）
#
# 三种引入模式：
#   submodule —— 完整源码以 git submodule 形式放在 third_party/<name>/
#                升级：sh scripts/sync-upstream.sh update <name>
#   sparse    —— 只拉 paths 里列的几个文件，写到 dest
#                升级：同上，脚本按 commit 逐个下载并校验 sha256
#   gomod     —— Go 依赖，版本由 go.mod / go.sum 锁定，源码不入库
#                实际路径：模块代理（GOPROXY）下载到本地模块缓存 GOMODCACHE，
#                go.sum 里的 h1: 摘要保证字节级可复现。
#                升级：go get <pkg>@<ver> && go mod tidy
#                注意：本仓库**不使用** vendor/ 目录。Go 依赖靠 go.mod + go.sum
#                加模块代理复现，vendor/ 会让每次升级都在主仓库历史里留一份完整源码快照

version = 1
updated = "2026-10-28"

# ─────────────────────────────────────────────────────────────
# 沙箱底座
# ─────────────────────────────────────────────────────────────
[[source]]
name        = "cubesandbox"
mode        = "submodule"
repo        = "https://github.com/TencentCloud/CubeSandbox.git"
ref         = "master"
commit      = "0fea4f8c365f8105a47ce2e0b2dc2cffd1ac363d"
license     = "Apache-2.0"
dest        = "third_party/cubesandbox"
size_hint   = "57.8 MB (git objects)"
purpose     = """
沙箱底座（KVM microVM / RustVMM）。需要能读、能改、能在本地构建镜像，
不能只依赖官方镜像——CubeEgress 的默认拒绝网段会覆盖 k8s pod/service CIDR，
这个必须按我们的网络规划 patch。
"""
license_note = """
LICENSE 文件 25,798 字节，主体为 Apache-2.0，另附第三方组件清单（3 项）：

  1. kata-containers    → Apache-2.0（Tencent 声明有修改）
  2. cloud-hypervisor   → Apache-2.0（Tencent 声明有修改）
  3. cilium/bpf         → BSD-2-Clause OR GPL-2.0 双许可，
                          Tencent 明确 "elected to use it under the terms of BSD-2-Clause"

除根 LICENSE 外，源码树里另有 5 个独立许可文件（此前漏报，已逐个打开核实）：

  4. hypervisor/LICENSE-APACHE                  Apache-2.0
  5. hypervisor/LICENSE-BSD-3-Clause            BSD-3-Clause（Copyright 2017 The Chromium OS Authors）
  6. hypervisor/virtiofsd/LICENSE-APACHE        Apache-2.0
  7. hypervisor/virtiofsd/LICENSE-BSD-3-Clause  BSD-3-Clause（Copyright 2017 The Chromium OS Authors）
  8. hypervisor/docs/COPYING.docs               CC-BY-4.0（Attribution 4.0 International）

口径说明，避免误判：

  · 第 1–7 项全部是 Apache-2.0 / BSD 系，无 copyleft，符合项目红线。
  · 第 8 项 CC-BY-4.0 **不是 OSI 软件许可，是文档/内容许可**，确实在
    「只认 Apache-2.0 / MIT / BSD」这条红线之外。但它的性质是「署名即合规」的
    引用型许可：不要求衍生作品同样开源，无 copyleft 传染。我们不修改
    hypervisor/docs/ 下的文档，因此也不触发 CC-BY 的「改编」条款，
    只需保留署名——已在根 NOTICE 中列明。随源码原样分发是安全的。
  · 所以「本仓库许可全是 Apache/MIT/BSD」这句话不成立。准确表述是：
    代码许可全部为 Apache-2.0 / BSD 系，文档许可为 CC-BY-4.0（署名型、无传染）。
GitHub 把本仓库标为 NOASSERTION，仅因为「混合许可 + 腾讯自定义前言」，不是许可有问题。
"""

# ─────────────────────────────────────────────────────────────
# Agent 运行时
# ─────────────────────────────────────────────────────────────
[[source]]
name        = "deepseek-harness"
mode        = "submodule"
repo        = "https://github.com/deepseek-ai/deepseek-harness.git"
ref         = "master"
commit      = "f3803c96974ad4a94195fb97e5c637e9c2a3afe3"
license     = "MIT"
dest        = "third_party/deepseek-harness"
size_hint   = "整仓 351.8 MB；sparse-checkout 后工作区约 2.7 MB / 340 个文件"
purpose     = """
沙箱内 agent 运行时，`dsh --profile acp` 启动。
引入源码的目的不是构建（运行时用 dsh-trim/ 从 npm 装的裁剪版），而是：
  · 审计——ACP 实现、权限模型、遥测行为必须可读
  · 扩展——未来平台能力以 DSH 插件形式下沉，比只能走 MCP 更深入
  · 对比——上游一改，能立刻 diff 出对 ACP 的影响
sparse-checkout 保留的子树，正好覆盖上面三条：
  · packages/acp/    ACP 协议实现（含 request_permission 语义、能力声明）
  · packages/core/   agent 引擎（agent-loop / session / tools / tool-executor）
  · 根目录元数据      package.json / pnpm-workspace.yaml / THIRD_PARTY_NOTICES.md / SAFETY.md
                       （cone 模式自动包含根文件，不必单列）
"""
note = """
为什么是 submodule 而不是把文件拷进来（曾经就是这么做的）：
  · GitHub 上点进去直接跳上游原仓库与具体 commit —— 审计时不必「相信我们的拷贝」
  · 升级 = 改一行 commit，不用重新下载 340 个文件
  · 许可与归属天然可追溯（MIT 要求保留版权声明，上游 LICENSE 随 submodule 就在）
代价与对策：
  整仓 351.8 MB，直接 `git submodule update --init` 会全量检出；
  SSH 实测连握手阶段都能卡 5 分钟没动静。所以 fetch 走
  `--filter=blob:none`（只拉 commit+tree，实测 27 秒）+ `--depth 1` + sparse-checkout，
  只在工作区放两个 packages 子树。见 scripts/sync-upstream.sh 的 fetch_submodule。
为什么裁切用 sparse-checkout 而不是删文件：
  删文件会让 submodule 变脏（git status 有改动），GitHub 上看到的也不再是干净上游；
  sparse-checkout 只写本地配置、不动 commit，上游完整性不受影响。
⚠️ 运行时**不要**用这份源码构建。版本以 dsh-trim/package.json 钉死的精确版本为准。
⚠️ 上游仍是预发布（v0.2.2-rc.x），自称会有兼容性破坏。升级当独立任务做，别顺手 bump。
"""
paths = [
  "packages/acp/",
  "packages/core/",
]

# ─────────────────────────────────────────────────────────────
# envd 数据面协议
